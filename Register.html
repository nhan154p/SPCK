<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style_register.css" />

    <div class="img_register">
        <img src="img/login_logo.png" alt="login-logo">
      </div>
    <form class="form_background">

        <h2>Đăng kí</h2>
        <p>Tiếp tục truy cập PhoneZone</p>
      </div>
      <div class="form-register">
        <label>Email</label>
        <input type="email" placeholder="Nhập Email">
        <label>Password</label>
        <input type="password" placeholder="Nhập Password">
        <label>Nhập lại Password</label>
        <input type="password" placeholder="Nhập lại Password">
        <button>Đăng Nhập</button>
      </div>
      <div class="register_footer">
        <p>Đã có tài khoản PhoneZone?</p>
        <a href="Login.html">Đăng nhập</a>
      </div>
    </form>
    <footer>

    </footer>
